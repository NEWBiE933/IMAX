name: CGV Yongsan IMAX Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: cgv-imax-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check CGV
        env:
          CGV_THEATER_NAME: "용산아이파크몰"
          CGV_FORMAT_KEYWORD: "IMAX"
          # 실제 예매 페이지 URL을 확인한 뒤 Repository Variable/Secret로 교체 권장
          CGV_BOOKING_URL: ${{ vars.CGV_BOOKING_URL }}
        run: |
          if [ -z "$CGV_BOOKING_URL" ]; then
            export CGV_BOOKING_URL="https://cgv.co.kr/"
          fi
          npm run check

      - name: Create notification issue
        if: ${{ hashFiles('data/new_dates.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATES="$(cat data/new_dates.txt)"
          TITLE="[CGV] 용산 IMAX 신규 예매일 오픈"
          BODY="용산아이파크몰 IMAX에서 새 예매일 후보를 감지했습니다.

          신규 날짜:
          \`\`\`
          ${DATES}
          \`\`\`

          바로 CGV 예매 페이지를 확인하세요.

          > 이 알림은 화면 기반 자동 감지 결과입니다. CGV UI 변경 시 오탐/미탐이 있을 수 있습니다."
          gh issue create --title "$TITLE" --body "$BODY"

      - name: Persist state only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore: update CGV watcher state"
            git push
          fi
